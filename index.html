<style>
/* Layout: Spielbrett-Bildschirm. Landkarte links (Beamer), Spielleiter-Panel rechts; mobil untereinander. Bewusst einheitlich nachtblau wie die Buchcover. */
:root{
  --nacht:#0B162E; --nacht2:#132449; --nacht3:#1C3263; --linie:#2B4479;
  --tinte:#E8EEF7; --tinte2:#A9B8D2; --gold:#F5AD00; --himmel:#4CC0F0;
  --karte:#F2F5FA; --karteText:#0B162E; --karte2:#5A6B85;
  --ok:#43C384; --no:#EE6A52;
  --display:"Alegreya",Georgia,"Times New Roman",serif;
  --text:"Alegreya Sans","Segoe UI",Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--nacht);color:var(--tinte);font-family:var(--text);font-size:16px;line-height:1.45}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--himmel);outline-offset:2px}
.huelle{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 24px;max-width:1500px;margin:0 auto}
header.kopf{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.marke{font-family:var(--display);font-weight:800;font-size:clamp(24px,3vw,34px);letter-spacing:.01em;margin:0}
.marke span{color:var(--gold)}
.unterzeile{color:var(--tinte2);font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.kopf .raum{flex:1}
.knopf{border:2px solid var(--gold);background:var(--gold);color:var(--nacht);font-weight:800;border-radius:8px;padding:10px 18px;font-size:16px}
.knopf:hover{filter:brightness(1.08)}
.knopf.leise{background:transparent;color:var(--gold)}
.knopf.klein{padding:6px 12px;font-size:14px}
.knopf:disabled{opacity:.4;cursor:default}

/* Setup */
.setup{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px}
.tafel{background:var(--nacht2);border:1px solid var(--linie);border-radius:12px;padding:20px}
.tafel h2{font-family:var(--display);font-size:24px;margin:0 0 4px}
.tafel p{margin:6px 0;color:var(--tinte2)}
.teamzeile{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1.2fr) 34px;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--linie)}
.farbe{width:30px;height:30px;border-radius:50%;border:2px solid var(--tinte);padding:0}
.feld{width:100%;background:var(--nacht);border:1px solid var(--linie);border-radius:6px;padding:8px 10px}
.weg{background:none;border:none;color:var(--tinte2);font-size:22px;line-height:1}
.lagetext{grid-column:2/4;font-size:14px;color:var(--tinte2);margin-top:-4px}
.eigenwerte{grid-column:2/4;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.eigenwerte label{font-size:12px;color:var(--tinte2);display:flex;flex-direction:column;gap:2px}
.regeln ol{padding-left:20px;margin:10px 0}
.regeln li{margin:6px 0}
.regeln b{color:var(--gold)}

/* Spiel */
.spiel{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:18px;align-items:start}
.kartebox{background:var(--nacht2);border:1px solid var(--linie);border-radius:14px;overflow:hidden}
.kartebox svg{display:block;width:100%;height:auto}
.panel{display:flex;flex-direction:column;gap:14px}
.zug{background:var(--nacht2);border:1px solid var(--linie);border-radius:14px;padding:18px}
.zugkopf{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.punkt{width:16px;height:16px;border-radius:50%;flex:none;border:2px solid var(--tinte)}
.zugkopf .wer{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.1}
.zugkopf .runde{margin-left:auto;font-size:13px;color:var(--tinte2);text-transform:uppercase;letter-spacing:.08em}
.ziel{font-size:13px;color:var(--tinte2);text-transform:uppercase;letter-spacing:.08em}
.ziel b{color:var(--gold);font-weight:700}
.stationtitel{font-family:var(--display);font-size:20px;font-weight:700;margin:2px 0 8px}
.aktion{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}

.pkarte{background:var(--karte);color:var(--karteText);border-radius:12px;padding:18px 18px 14px;box-shadow:0 14px 34px rgba(0,0,0,.35)}
.pkarte.auf{animation:auf .35s ease-out}
@keyframes auf{from{transform:translateY(10px) rotate(-1deg);opacity:.2}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.pkarte,.wuerfel.rollt{animation:none!important}}
.pkarte .etikett{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--karte2)}
.pkarte h3{font-family:var(--display);font-size:24px;line-height:1.15;margin:4px 0 8px;text-wrap:balance}
.pkarte .lage{font-family:var(--display);font-size:17px;line-height:1.45;margin:0 0 12px}
.option{display:block;width:100%;text-align:left;background:#fff;border:2px solid #D3DCEA;border-radius:9px;padding:10px 12px;margin-top:8px;color:var(--karteText)}
.option:hover{border-color:var(--nacht)}
.option .t{font-weight:700;display:block}
.option .probe{font-size:13px;color:var(--karte2)}
.option .probe b{color:var(--karteText)}
.mentor{margin-top:12px;border-top:1px dashed #B9C5D8;padding-top:10px;font-size:14px;color:var(--karte2)}
.mentor b{color:var(--karteText)}
.mentorgross{background:var(--gold);color:var(--nacht);border-radius:10px;padding:14px 16px;font-family:var(--display);font-size:20px;font-weight:700;line-height:1.3;margin-top:12px}
.mentorgross small{display:block;font-family:var(--text);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;margin-bottom:4px}

.wurfzeile{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:12px}
.wuerfel{width:64px;height:64px;border-radius:12px;background:#fff;color:var(--nacht);display:grid;place-items:center;font-family:var(--display);font-size:36px;font-weight:800;box-shadow:inset 0 -4px 0 #C9D3E3}
.wuerfel.rollt{animation:roll .5s linear infinite}
@keyframes roll{0%{transform:rotate(0)}50%{transform:rotate(180deg) scale(.9)}100%{transform:rotate(360deg)}}
.rechnung{font-size:15px;color:var(--karte2)}
.rechnung b{color:var(--karteText);font-size:18px}
.echte{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.echte button{width:38px;height:38px;border-radius:8px;border:2px solid #C9D3E3;background:#fff;color:var(--nacht);font-weight:800}
.schalter{display:flex;align-items:center;gap:8px;margin-top:12px;font-weight:700;font-size:15px}
.schalter input{width:20px;height:20px;accent-color:var(--gold)}

.urteil{font-family:var(--display);font-size:24px;font-weight:800;margin:4px 0}
.urteil.ok{color:#1F8C57}.urteil.no{color:#C4442E}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:13px;font-weight:700;border-radius:20px;padding:3px 10px;background:#E1E8F2;color:var(--karteText)}
.chip.plus{background:#D4F2E3;color:#145E3A}.chip.minus{background:#FBDDD6;color:#8A2A18}
.ereignis{background:var(--nacht3);color:var(--tinte);border:2px solid var(--himmel)}
.ereignis .etikett{color:var(--himmel)}
.ereignis .mentor,.ereignis .rechnung{color:var(--tinte2)}
.ereignis .chip{background:#2A447A;color:var(--tinte)}
.ereignis .chip.plus{background:#1E5A43;color:#C9F4DF}.ereignis .chip.minus{background:#6A2A22;color:#FFD9D0}

.teams{background:var(--nacht2);border:1px solid var(--linie);border-radius:14px;padding:6px 14px}
.teamkarte{padding:10px 0;border-top:1px solid var(--linie);display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.teamkarte:first-child{border-top:none}
.teamkarte.dran .tname{color:var(--gold)}
.tname{font-weight:800}
.tinfo{font-size:13px;color:var(--tinte2);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.balken{grid-column:2/4;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px}
.balken div{height:18px;border-radius:3px;background:var(--nacht);position:relative;overflow:hidden}
.balken div i{position:absolute;left:0;right:0;bottom:0;display:block}
.balken div span{position:absolute;inset:0;font-size:10px;font-weight:800;display:grid;place-items:center;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.legende{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px;font-size:10px;color:var(--tinte2);text-align:center;margin:8px 0 2px 26px}
.fuss{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}

/* Ende */
.ende h2{font-family:var(--display);font-size:30px;margin:0 0 4px}
.berichte{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:18px;margin-top:16px}
.bericht{background:var(--nacht2);border:1px solid var(--linie);border-radius:14px;padding:18px}
.bericht h3{font-family:var(--display);font-size:24px;margin:0;display:flex;align-items:center;gap:10px}
.index{font-family:var(--display);font-size:44px;font-weight:800;color:var(--gold);line-height:1}
.dimzeile{display:grid;grid-template-columns:110px minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.dimbar{height:12px;background:var(--nacht);border-radius:6px;position:relative}
.dimbar i{position:absolute;top:0;bottom:0;left:0;border-radius:6px;background:var(--himmel)}
.dimbar em{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--tinte2);border-radius:2px}
.delta{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.hausaufgaben{background:var(--nacht);border-radius:10px;padding:12px 14px;margin-top:12px}
.hausaufgaben h4,.logbuch h4{margin:0 0 6px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.hausaufgaben ul{margin:0;padding-left:18px}
.logbuch{margin-top:12px;max-height:220px;overflow:auto;font-size:13px;color:var(--tinte2)}
.logbuch div{padding:4px 0;border-top:1px solid var(--linie)}
.logbuch b{color:var(--tinte)}
a{color:var(--himmel)}
.kopierzeile{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.hinweis{font-size:13px;color:var(--tinte2)}

@media (max-width:1000px){
  .spiel,.setup{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){
  .teamzeile{grid-template-columns:30px minmax(0,1fr) 30px}
  .teamzeile select{grid-column:2/3}
  .lagetext,.eigenwerte{grid-column:1/4}
  .eigenwerte{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dimzeile{grid-template-columns:86px minmax(0,1fr) 36px}
}
</style>
<style>
/* Ergänzungen v3: Einstieg, Selbsteinschätzung, Begleiter */
.einstieg{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:22px}
.schritt{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin:18px 0 6px}
.schritt:first-of-type{margin-top:6px}
.frage{width:100%;min-height:74px;resize:vertical;background:var(--nacht);border:1px solid var(--linie);border-radius:8px;padding:10px 12px;font-size:17px;font-family:var(--display)}
.beispiele{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.beispiele button{background:transparent;border:1px dashed var(--linie);color:var(--tinte2);border-radius:20px;padding:4px 10px;font-size:13px}
.beispiele button:hover{border-color:var(--gold);color:var(--tinte)}
.zwei{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.bewertung{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:8px 0;border-top:1px solid var(--linie)}
.bewertung .dn{font-weight:700;font-size:15px}
.bewertung .dq{grid-column:1/2;font-size:13px;color:var(--tinte2)}
.skala{grid-row:1/3;grid-column:2;display:flex;gap:4px}
.skala button{width:34px;height:34px;border-radius:8px;border:2px solid var(--linie);background:var(--nacht);font-weight:800;color:var(--tinte2)}
.skala button.an.r{background:var(--no);border-color:var(--no);color:var(--nacht)}
.skala button.an.g{background:var(--gold);border-color:var(--gold);color:var(--nacht)}
.skala button.an.gr{background:var(--ok);border-color:var(--ok);color:var(--nacht)}
.mentorwahl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.mentorwahl label{display:flex;gap:10px;align-items:center;background:var(--nacht);border:2px solid var(--linie);border-radius:10px;padding:10px 12px;cursor:pointer}
.mentorwahl label.an{border-color:var(--gold)}
.mentorwahl input{width:18px;height:18px;accent-color:var(--gold)}
.mentorwahl small{display:block;color:var(--tinte2);font-size:12px}
.teamblock{border:1px solid var(--linie);border-radius:12px;padding:14px;margin-top:14px;background:rgba(0,0,0,.12)}
.teamblock .tbkopf{display:flex;align-items:center;gap:10px}
.teamblock .tbkopf .feld{flex:1}
.fehler{color:var(--no);font-weight:700;font-size:14px;margin-top:8px}
.portrait{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:17px;color:var(--nacht)!important;flex:none;border:2px solid rgba(255,255,255,.6)}
.portrait.klein{width:28px;height:28px;font-size:13px}
.runde-begleiter{display:flex;flex-direction:column;gap:8px}
.bgl{display:flex;gap:10px;align-items:center}
.bgl b{display:block;font-size:14px}
.bgl span{font-size:12px;color:var(--tinte2)}
.sprech{display:flex;gap:10px;align-items:flex-start;margin-top:10px}
.blase{background:#E6ECF5;color:var(--karteText);border-radius:4px 12px 12px 12px;padding:9px 12px;font-size:15px;line-height:1.4;flex:1;min-width:0}
.blase b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--karte2);margin-bottom:2px}
.blase.mentor{background:var(--gold);color:var(--nacht)}
.blase.mentor b{color:#5A3E00}
.fragen{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px;padding-top:10px;border-top:1px dashed #B9C5D8}
.fragen .lbl{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--karte2);width:100%}
.fragbtn{display:inline-flex;align-items:center;gap:6px;border:2px solid #C9D3E3;background:#fff;border-radius:20px;padding:3px 10px 3px 3px;font-weight:700;font-size:14px;color:var(--karteText)}
.fragbtn:hover{border-color:var(--nacht)}
.fragbtn.joker{border-color:var(--gold);background:#FFF5DA}
.fragbtn:disabled{opacity:.45;cursor:default}
.startfrage{background:var(--nacht);border-left:4px solid var(--gold);padding:10px 14px;border-radius:0 8px 8px 0;font-family:var(--display);font-size:18px;margin:8px 0}
.startfrage small{display:block;font-family:var(--text);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:800}
.pkarte .startfrage{background:#E6ECF5;color:var(--karteText)}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.cta a{text-decoration:none}
@media (max-width:1000px){.einstieg{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.zwei,.mentorwahl{grid-template-columns:minmax(0,1fr)}.bewertung{grid-template-columns:minmax(0,1fr)}.skala{grid-row:auto;grid-column:1}}
.ereignis .rechnung b,.ereignis .mentor b,.ereignis .lage b{color:var(--tinte)}
.kartenleiste{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
#welt3d canvas{display:block;max-width:100%}
.dauerwahl{grid-template-columns:repeat(3,minmax(0,1fr))}
.dauerwahl input{accent-color:var(--gold)}
.buchtipp{margin-top:12px;padding-top:10px;border-top:1px dashed #B9C5D8;display:flex;flex-direction:column;gap:6px}
.buchtipp .lbl{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--karte2)}
.buchlink{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--karteText);background:#fff;border:1px solid #D3DCEA;border-radius:8px;padding:7px 10px;font-size:14px;line-height:1.3}
a.buchlink:hover{border-color:var(--nacht)}
.buchlink.aus{opacity:.75}
.ereignis .buchlink{background:#22396E;color:var(--tinte);border-color:#2B4479}
.ereignis .buchtipp .lbl{color:var(--himmel)}
@media (max-width:760px){.dauerwahl{grid-template-columns:minmax(0,1fr)}}
</style>

ere holt Sie trotzdem ein.", "f": {"e": -1}}, "p": 0, "dim": 2}, {"t": "Die Leere zulassen und mit jemandem darüber reden", "dim": 2, "ziel": 7, "ok": {"x": "Trauer gehört dazu. Danach wird es leichter.", "f": {"d2": 1, "e": 2}}, "no": {"x": "Sie reden über Zinsen statt über Gefühle.", "f": {"e": -1}}, "p": 3}, {"t": "Eine Liste schreiben, was Sie jetzt ermöglicht haben", "dim": 1, "ziel": 7, "ok": {"x": "Arbeitsplätze gesichert, Familie versorgt, Zeit gewonnen. Sie atmen durch.", "f": {"d1": 2}}, "no": {"x": "Die Liste beginnt mit „verloren“.", "f": {"e": -1}}, "p": 2}], "beste": 1}, {"id": "5f5", "station": 5, "weg": "familie", "beste": 1, "titel": "Der Familienrat ohne Moderator", "text": "Sie berufen den Familienrat ein. Alle kommen. Nach zehn Minuten reden drei gleichzeitig, und Ihre Schwester holt alte Geschichten von 1987 heraus.", "mentor": "Wer sorgt in Ihrer Familie dafür, dass alle zu Wort kommen?", "optionen": [{"t": "Mit der Faust auf den Tisch hauen und entscheiden", "sicher": {"x": "Ruhe im Raum. Und Groll für die nächsten zehn Jahre.", "f": {"d2": -2}, "stay": true}, "p": 0, "dim": 2}, {"t": "Abbrechen und mit einer neutralen Moderation neu ansetzen", "dim": 2, "ziel": 7, "ok": {"x": "Beim zweiten Treffen gibt es Regeln. Und ein Ergebnis.", "f": {"d2": 2}}, "no": {"x": "Die Suche nach einem Termin für alle dauert zwei Monate.", "f": {"z": -3}, "stay": true}, "p": 3}, {"t": "Jeden einzeln fragen, was ihm wichtig ist", "dim": 2, "ziel": 7, "ok": {"x": "Unter vier Augen sagen alle etwas anderes als in der Runde. Wertvoll.", "f": {"d2": 1, "d3": 1}}, "no": {"x": "Die Einzelgespräche wirken wie Lagerbildung.", "f": {"d2": -1}, "stay": true}, "p": 2}]}, {"id": "5f6", "station": 5, "weg": "familie", "beste": 2, "titel": "Die Nachfolgerin will es anders", "text": "Ihre Tochter sagt Ja zur Übernahme. Mit einem Nachsatz: „Aber nicht so, wie du es machst. Ich will Wärmepumpen statt Ölheizungen und eine Vier-Tage-Woche.“", "mentor": "Übergeben Sie eine Firma – oder Ihre Art, sie zu führen?", "optionen": [{"t": "„Dann wird das nichts.“", "sicher": {"x": "Sie fährt nach Hause. Und ruft nicht an.", "f": {"d3": -2, "d2": -1}, "stay": true}, "p": 0, "dim": 3}, {"t": "Zustimmen, aber eine lange Übergangszeit mit Ihnen als Chef verlangen", "dim": 3, "ziel": 7, "ok": {"x": "Sie akzeptiert. Zähneknirschend.", "f": {"d3": 1}}, "no": {"x": "Sie fragt, wozu sie dann eigentlich kommt.", "f": {"d3": -1}, "stay": true}, "p": 2}, {"t": "Ihre Ideen ernst nehmen und einen gemeinsamen Zukunftsplan entwickeln", "dim": 3, "ziel": 7, "ok": {"x": "Die Wärmepumpen stehen im Plan. Und Ihr Name auf dem Firmenschild bleibt.", "f": {"d3": 2, "d8": 1}}, "no": {"x": "Der Plan braucht mehr Zeit, als Sie dachten.", "f": {"z": -3}, "stay": true}, "p": 3}]}, {"id": "5e5", "station": 5, "weg": "extern", "beste": 1, "titel": "Der Zeitplan", "text": "Sie wollen in einem Jahr verkauft haben. Ihr Begleiter lächelt höflich und sagt: „Realistisch sind eher zwei.“", "mentor": "Was passiert, wenn Sie unter Zeitdruck verkaufen müssen?", "optionen": [{"t": "Auf einem Jahr bestehen, Sie kennen Ihre Firma", "sicher": {"x": "Der Druck macht Sie zum schlechten Verhandler.", "f": {"d7": -1}, "stay": true}, "p": 0, "dim": 7}, {"t": "Einen realistischen Fahrplan mit Meilensteinen aufstellen", "dim": 1, "ziel": 7, "ok": {"x": "Zwei Jahre, klare Schritte. Zum ersten Mal fühlt sich das machbar an.", "f": {"d1": 1, "d6": 1}}, "no": {"x": "Der Fahrplan hat Lücken, die Sie erst später sehen.", "f": {"z": -2}, "stay": true}, "p": 3}, {"t": "Erst die Firma ein Jahr lang fit machen, dann verkaufen", "dim": 7, "ziel": 7, "ok": {"x": "Ein Jahr Vorbereitung. Und ein besseres Angebot danach.", "f": {"d7": 2}}, "no": {"x": "Im Vorbereitungsjahr kommt das Tagesgeschäft dazwischen.", "f": {"z": -4}, "stay": true}, "p": 2}]}, {"id": "5e6", "station": 5, "weg": "extern", "beste": 2, "titel": "Die Familie redet mit", "text": "Sie wollen verkaufen. Ihr Sohn, der nie in die Firma wollte, sagt plötzlich: „Die verkaufst du nicht an Fremde.“", "mentor": "Hat Ihr Sohn ein echtes Interesse – oder eine Verlustangst?", "optionen": [{"t": "Ihn ignorieren, er hatte seine Chance", "sicher": {"x": "Er ist verletzt. Und das Thema kommt beim Notar wieder.", "f": {"d2": -2}}, "p": 0, "dim": 2}, {"t": "Ihm noch einmal die Übernahme anbieten", "dim": 3, "ziel": 7, "ok": {"x": "Er überlegt drei Wochen. Dann sagt er ehrlich Nein. Jetzt ist es geklärt.", "f": {"d3": 1, "z": -1}}, "no": {"x": "Er sagt Ja aus Trotz. Ein Problem mehr.", "f": {"d3": -1}, "stay": true}, "p": 2}, {"t": "Nach dem Gefühl dahinter fragen und ihn einbinden", "dim": 2, "ziel": 7, "ok": {"x": "Es geht um sein Kinderzimmer über der Werkstatt. Erinnerungen. Er unterstützt den Verkauf.", "f": {"d2": 2}}, "no": {"x": "Das Gespräch kommt nicht in Gang.", "f": {"z": -2}, "stay": true}, "p": 3}]}, {"id": "6ff", "station": 6, "weg": "familie", "beste": 1, "titel": "Der Neffe", "text": "Ihr Neffe arbeitet seit acht Jahren im Betrieb. Er hatte sich insgeheim Hoffnungen gemacht. Jetzt übernimmt Ihre Tochter.", "mentor": "Wer verliert bei Ihrer Nachfolge etwas, ohne dass es jemand ausspricht?", "optionen": [{"t": "Nichts sagen, er wird es schon verstehen", "sicher": {"x": "Er versteht es. Und kündigt drei Monate später.", "f": {"d6": -2}}, "p": 0, "dim": 6}, {"t": "Offen mit ihm sprechen und ihm eine klare Rolle anbieten", "dim": 6, "ziel": 7, "ok": {"x": "Er wird Bereichsleiter. Und der wichtigste Verbündete Ihrer Tochter.", "f": {"d6": 1, "d3": 1}}, "no": {"x": "Er braucht Zeit. Die Stimmung bleibt angespannt.", "f": {"e": -1}}, "p": 3}, {"t": "Ihm eine kleine Beteiligung anbieten", "dim": 4, "ziel": 8, "ok": {"x": "Er fühlt sich wertgeschätzt. Die Verträge sind sauber.", "f": {"d4": 1, "d6": 1}}, "no": {"x": "Die Beteiligung macht die Gesellschafterstruktur kompliziert.", "f": {"d4": -1}}, "p": 2}]}, {"id": "6fg", "station": 6, "weg": "familie", "beste": 2, "titel": "Die Montagsrunde", "text": "Erste Montagsrunde unter neuer Führung. Ihre Tochter steht vorne. Sie stehen hinten. Alle Blicke gehen zu Ihnen.", "mentor": "Wohin sollen die Blicke in einem Jahr gehen?", "optionen": [{"t": "Nach vorne gehen und „kurz was ergänzen“", "sicher": {"x": "Aus kurz werden zwanzig Minuten. Ihre Tochter schweigt.", "f": {"d3": -2}}, "p": 0, "dim": 3}, {"t": "Hinten stehen bleiben und nichts sagen", "dim": 1, "ziel": 7, "ok": {"x": "Es fällt Ihnen schwer. Aber die Botschaft kommt an.", "f": {"d3": 1}}, "no": {"x": "Sie räuspern sich dreimal. Laut.", "f": {"d3": -1}}, "p": 2}, {"t": "Vorher vereinbaren, dass Sie die Runde gar nicht besuchen", "dim": 3, "ziel": 7, "ok": {"x": "Die Runde läuft ohne Sie. Die Belegschaft merkt: Es ist ernst.", "f": {"d3": 2, "d6": 1}}, "no": {"x": "Sie stehen trotzdem am Fenster und schauen zu.", "f": {"e": -1}}, "p": 3}]}, {"id": "6fh", "station": 6, "weg": "familie", "beste": 1, "titel": "Der Lieferant mit der alten Absprache", "text": "Ein Großhändler erinnert Sie an eine mündliche Absprache von vor 15 Jahren: Sonderkonditionen auf Lebenszeit. Ihre Tochter weiß davon nichts.", "mentor": "Welche Absprachen gibt es nur in Ihrem Kopf?", "optionen": [{"t": "Das regeln Sie weiter persönlich", "sicher": {"x": "Noch eine Sache, die nur Sie wissen.", "f": {"d3": -1, "d4": -1}}, "p": 0, "dim": 3}, {"t": "Alle mündlichen Absprachen aufschreiben und übergeben", "dim": 4, "ziel": 7, "ok": {"x": "Eine Liste mit 23 Punkten. Ihre Tochter staunt. Und ist dankbar.", "f": {"d4": 1, "d3": 1}}, "no": {"x": "Bei Punkt 12 erinnern Sie sich nicht mehr genau.", "f": {"z": -2}}, "p": 3}, {"t": "Die Absprache mit dem Lieferanten gemeinsam neu verhandeln", "dim": 8, "ziel": 7, "ok": {"x": "Neue Konditionen, schriftlich. Die Tochter verhandelt mit.", "f": {"d8": 1, "d3": 1}}, "no": {"x": "Der Lieferant fühlt sich hintergangen.", "f": {"d8": -1}}, "p": 2}]}, {"id": "6ef", "station": 6, "weg": "extern", "beste": 2, "titel": "Der Strategische Käufer", "text": "Ein größerer Wettbewerber will Ihre Firma als Standort übernehmen. Er bietet gut. Ihr Name verschwindet nach zwei Jahren vom Firmenschild.", "mentor": "Wie wichtig ist Ihnen Ihr Name – im Vergleich zu Ihren Leuten?", "optionen": [{"t": "Ablehnen, der Name bleibt", "sicher": {"x": "Der Name bleibt. Der beste Käufer geht.", "f": {"d8": -1}}, "p": 0, "dim": 8}, {"t": "Annehmen, Name ist nur Name", "dim": 8, "ziel": 7, "ok": {"x": "Ein guter Preis. Der Abschied vom Schild tut trotzdem weh.", "f": {"d7": 1, "e": -1}}, "no": {"x": "Sie merken erst später, wie sehr Sie am Namen hängen.", "f": {"e": -2}}, "p": 2}, {"t": "Klären, was Ihnen wirklich wichtig ist, und genau das verhandeln", "dim": 1, "ziel": 7, "ok": {"x": "Arbeitsplätze und Standort sind gesichert. Der Name war doch nicht das Wichtigste.", "f": {"d1": 1, "d6": 1}}, "no": {"x": "Sie sind sich selbst nicht sicher. Die Verhandlung stockt.", "f": {"z": -3}}, "p": 3}]}, {"id": "6eg", "station": 6, "weg": "extern", "beste": 1, "titel": "Die Absichtserklärung", "text": "Der Interessent schickt eine Absichtserklärung. Zwei Seiten, freundlich formuliert. Exklusivität für sechs Monate.", "mentor": "Was verlieren Sie, wenn Sie sechs Monate mit niemandem sonst reden dürfen?", "optionen": [{"t": "Unterschreiben, ist ja nicht bindend", "sicher": {"x": "Die Exklusivität ist bindend. Sechs Monate ohne Alternative.", "f": {"d4": -1, "d8": -1}}, "p": 0, "dim": 4}, {"t": "Exklusivität kürzen und klare Meilensteine vereinbaren", "dim": 4, "ziel": 7, "ok": {"x": "Drei Monate, mit Ausstiegsrecht. Fair für beide.", "f": {"d4": 2}}, "no": {"x": "Er will sechs Monate. Kompromiss: fünf.", "f": {"z": -2}}, "p": 3}, {"t": "Erst alle Gespräche mit anderen Interessenten abschließen", "dim": 8, "ziel": 7, "ok": {"x": "Sie unterschreiben mit dem besten Bieter. Mit gutem Gefühl.", "f": {"d8": 1}}, "no": {"x": "Der erste Interessent wird ungeduldig.", "f": {"z": -3}}, "p": 2}]}, {"id": "6eh", "station": 6, "weg": "extern", "beste": 2, "titel": "Der Bankberater wird nervös", "text": "Ihre Hausbank erfährt vom Verkaufsplan. Der Berater fragt, ob er die Kreditlinie „vorsorglich anpassen“ soll.", "mentor": "Wer sollte von Ihrem Verkauf wann erfahren?", "optionen": [{"t": "Die Bank beschwichtigen: alles nur Gerede", "sicher": {"x": "Er glaubt Ihnen nicht. Das Rating sinkt.", "f": {"d7": -1}}, "p": 0, "dim": 7}, {"t": "Die Bank um Geduld bitten", "dim": 7, "ziel": 7, "ok": {"x": "Sie verschafft Ihnen Zeit. Mit Auflagen.", "f": {"z": -1}}, "no": {"x": "Die Kreditlinie wird gekürzt.", "f": {"d7": -1}}, "p": 2}, {"t": "Die Bank offen informieren und als Partner einbinden", "dim": 7, "ziel": 7, "ok": {"x": "Die Bank kennt sogar einen Interessenten. Und begleitet den Prozess.", "f": {"d7": 1, "d8": 1}}, "no": {"x": "Die Bank bleibt skeptisch.", "f": {"e": -1}}, "p": 3}]}, {"id": "7ff", "station": 7, "weg": "familie", "beste": 2, "titel": "Was in Ihrem Kopf steckt", "text": "Ihre Tochter fragt: „Woher weißt du eigentlich, welcher Kunde welche Anlage hat?“ Sie tippen sich an die Stirn.", "mentor": "Was passiert mit Ihrem Wissen, wenn Sie nicht mehr da sind?", "optionen": [{"t": "„Das lernst du mit der Zeit.“", "sicher": {"x": "Mit welcher Zeit? Sie wollen in einem Jahr raus.", "f": {"d3": -1, "d6": -1}}, "p": 0, "dim": 3}, {"t": "Ein paar wichtige Dinge aufschreiben", "dim": 6, "ziel": 7, "ok": {"x": "Ein guter Anfang. Viel bleibt noch im Kopf.", "f": {"d6": 1}}, "no": {"x": "Die Liste bleibt halb fertig.", "f": {"z": -2}}, "p": 2}, {"t": "Systematisch Wissen übergeben: Kundentermine zu zweit, Notizen, Software", "dim": 6, "ziel": 7, "ok": {"x": "Nach sechs Monaten weiß Ihre Tochter mehr als Sie. Fast.", "f": {"d6": 2, "d3": 1}}, "no": {"x": "Die Software-Einführung frisst Zeit.", "f": {"z": -3}}, "p": 3}]}, {"id": "7fg", "station": 7, "weg": "familie", "beste": 1, "titel": "Das Gehalt der Nachfolgerin", "text": "Ihre Tochter fragt nach ihrem Gehalt als Geschäftsführerin. Sie hatten sich das noch nie überlegt. Sie selbst haben sich seit Jahren function esc(t){ return String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function zufall(a){ return a[Math.floor(Math.random()*a.length)]; }
function klemmen(v){ return Math.max(1, Math.min(5, v)); }
function hash(s){ let h = 0; for(const c of s) h = (h*31 + c.charCodeAt(0)) >>> 0; return h; }
function waehle(a, key){ return a[hash(key) % a.length]; }

}

function karteZiehen(){
  const t = team(), nr = naechsteStation(t);
  const passend = D.pruefungen.filter(k => k.station === nr && (!k.weg || k.weg === t.weg));
  let frei = passend.filter(k => !S.gezogen.includes(k.id));
  if(!frei.length){ S.gezogen = S.gezogen.filter(id => !passend.some(k => k.id === id)); frei = passend; }
  // Gewichtung nach der Ersteinordnung: Karten zu schwachen Dimensionen kommen häufiger
  const gewicht = k => 1 + k.optionen.filter(o => !o.sicher).reduce((sum, o) => sum + (t.start[o.dim-1] <= 2 ? 3 : t.start[o.dim-1] === 3 ? 1 : 0), 0);

  let x = Math.random() * summe, k = frei[0];
  for(const c of frei){ x -= gewicht(c); if(x <= 0){ k = c; break; } }
  S.gezogen.push(k.id);
  const schwach = k.optionen.filter(o => !o.sicher && t.start[o.dim-1] <= 2).map(o => o.dim);
  S.zug = { karte:k.id, wahl:null, joker:false, mentor:null, ergebnis:null, gefragt:[], stimme: zufall(AVIDS), grund: schwach.length ? schwach[0] : null };

function avatarWahl(id, t, k){
  const A = AV[id], sicher = k.optionen.find(o => o.sicher);

  if(id === 'bernd') return besteOption(t, k, o => A.dims.includes(o.dim)) || sicher || besteOption(t, k);

function avatarTipp(id, t, k){
  const A = AV[id], o = avatarWahl(id, t, k), key = k.id + id;

function buchHinweise(kartenId, nr, weg, ereignisTitel){
  const H = D.buchhinweise; let liste = [];
  if(ereignisTitel && H.ereignisse[ereignisTitel]) liste = H.ereignisse[ereignisTitel];
  else if(kartenId && H.karten[kartenId]) liste = H.karten[kartenId];
  else if(nr){ liste = H.stationen[String(nr) + (weg === 'familie' ? 'f' : weg === 'extern' ? 'e' : '')] || H.stationen[String(nr)] || []; }
  return liste.slice(0, 2);
}
function fragen(id){ if(!S.zug.gefragt.includes(id)) S.zug.gefragt.push(id); sichern(); render(); }
function mentorFragen(id){ const t = team(); if(S.zug.joker || t.joker < 1) return; S.zug.joker = true; S.zug.mentor = id; sichern(); render(); }

function optionWaehlen(i){
  const t = team(), k = karte(), o = k.optionen[i];
  S.zug.wahl = i;
  t.punkte += o.p; t.maxPunkte += 3;
  if(o.sicher){ S.zug.bewertung = { p:0 }; aufloesen(o.sicher, null); return; }
  const wert = t.werte[o.dim-1], joker = S.zug.joker;
  // Die Antwort entscheidet, die Vorbereitung (Dimensionswert) trägt sie:
  // 3 Punkte gelingen immer, 2 Punkte ab Wert 3 (mit Mentor immer), 1 Punkt ab Wert 4 (mit Mentor ab 3)
  const erfolg = o.p === 3 || (o.p === 2 && (wert >= 3 || joker)) || (o.p === 1 && (wert >= 4 || (joker && wert >= 3)));
  if(joker && o.p < 3) t.joker = Math.max(0, t.joker - 1); else if(joker) S.zug.jokerGespart = true;
  S.zug.bewertung = { p:o.p, wert, joker };
  aufloesen(erfolg ? o.ok : o.no, erfolg);
}
function anwenden(t, f){
  const out = [];
  for(const [k, v] of Object.entries(f || {})){
    if(!v) continue;
    if(k[0] === 'd'){ const i = +k.slice(1) - 1, vor = t.werte[i]; t.werte[i] = klemmen(vor + v); out.push({k:DIM[i].kurz, v:t.werte[i]-vor, roh:v}); }
    else if(k === 'z'){ const vz = Math.round(v * dauerCfg().zf) || Math.sign(v); t.zeit += vz; out.push({k:'Zeitverlust', v:-vz, einheit:' Mon.', zeit:true}); }
    else if(k === 'e'){ const vor = t.kraft; t.kraft = Math.min(10, t.kraft + v); out.push({k:'Kraft', v:(t.kraft - vor) || v}); }
    else if(k === 'j'){ t.joker = Math.max(0, t.joker + v); out.push({k:'Mentor-Joker', v}); }
  }
  return out;
}
function aufloesen(r, ok){
  const t = team(), k = karte(), o = k.optionen[S.zug.wahl], nr = naechsteStation(t);
  const effekte = anwenden(t, r.f);
  if(t.notfall){ t.kraft -= 1; effekte.push({k:'Kraft (Notfall)', v:-1}); }
  const N = dauerCfg().n;
  // Rückschlag: Wer an einer Schwelle ausweicht, fällt eine Station zurück
  const zurueck = !!r.stay && !!ST[nr].schwelle && ok === null && t.pos > 1;
  const bleibt = !!r.stay && !zurueck;
  let weiterGezogen = false, dauerPlan = 0, gespart = 0;
  if(zurueck){ t.pos = t.pos - 1; t.hier = Math.max(0, N - 1); t.gespartHier = 0; } // zurück an die vorige Station, eine Karte genügt für den Rückweg
  else if(!bleibt){
    t.hier = (t.hier || 0) + 1;
    if(S.zug.bewertung && S.zug.bewertung.p === 3) t.gespartHier = (t.gespartHier || 0) + 1;
    if(t.hier >= N){
      // Station geschafft: Die Etappe dauert so lange wie in der Praxis; überwiegend starke Antworten sparen einen Monat
      dauerPlan = ST[nr].dauer || 0;
      gespart = (dauerPlan >= 2 && t.gespartHier >= Math.ceil(N / 2)) ? 1 : 0;
      t.zeit -= dauerPlan - gespart;
      t.pos = nr; t.hier = 0; t.gespartHier = 0; weiterGezogen = true;
      if(N > 1 && t.kraft < 10){ t.kraft += 1; effekte.push({k:'Kraft (Etappe geschafft)', v:1}); }
    }
  }
  t.log.push({st:nr, txt:k.titel + ': ' + o.t + (ok === null ? '' : ok ? ' – geschafft' : ' – nicht geschafft') + (bleibt ? ' (bleibt stehen)' : '') + (zurueck ? ' – Rückschlag auf Station ' + t.pos : '')});
  const art = ok === null ? 'sicher' : ok ? 'ok' : 'no';
  const wer = zufall(AVIDS.filter(id => id !== S.zug.stimme)) || zufall(AVIDS);
  lektuereMerken(t, buchHinweise(k.id, k.station, t.weg));
  S.zug.ergebnis = { x:r.x, ok, bleibt, zurueck, effekte, weiter:weiterGezogen, hier:t.hier, n:N, dauer:dauerPlan - gespart, gespart, reaktion:{ id:wer, text:zufall(AV[wer].zitate[art]) } };
  S.schritt = 'ergebnis'; sichern(); render();
}
function ereignisZiehen(){

  if(!frei.length){ S.ereignisseGezogen = []; frei = D.ereignisse.map((e,i)=>i); }
  const i = zufall(frei); S.ereignisseGezogen.push(i);

}

function ereignisAntwort(j){

function pruefeZustand(){

function pfad(pkte){
  let d = `M${pkte[0].x},${pkte[0].y}`;
  for(let i = 0; i < pkte.length-1; i++){
    const p0 = pkte[i-1] || pkte[i], p1 = pkte[i], p2 = pkte[i+1], p3 = pkte[i+2] || p2;
    const c1x = p1.x + (p2.x - p0.x)/6, c1y = p1.y + (p2.y - p0.y)/6;
    const c2x = p2.x - (p3.x - p1.x)/6, c2y = p2.y - (p3.y - p1.y)/6;
    d += ` C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2.x},${p2.y}`;
  }
  return d;
}

function weltSchleife(zeit){
  const W = WELT; if(!W.bereit) return;
  const dt = Math.min(0.05, (zeit - (W.zuletzt || zeit)) / 1000); W.zuletzt = zeit;
  const el = W.renderer.domElement, box = el.parentNode;
  if(box && el.isConnected){
    const b = box.clientWidth, h = Math.round(b * 0.58);
    if(el.width !== Math.round(b * W.renderer.getPixelRatio()) || el.height !== Math.round(h * W.renderer.getPixelRatio())){ W.renderer.setSize(b, h, false); el.style.width = b + 'px'; el.style.height = h + 'px'; W.camera.aspect = b / h; W.camera.updateProjectionMatrix(); }

    let aktivPos = null, laeuft = false;
    Object.entries(W.figuren).forEach(([i, f]) => {
      const d = f.ziel - f.t;
      if(Math.abs(d) > 0.0005){ f.t += Math.sign(d) * Math.min(Math.abs(d), dt * 0.06); laeuft = true; }
      const p = W.kurve.getPoint(Math.max(0, Math.min(1, f.t)));
      const tang = W.kurve.getTangent(Math.max(0.001, Math.min(0.999, f.t)));

    const dist = (W.folgen && aktivPos) ? W.abstand : Math.max(W.abstand, 19);
    W.ziel.lerp(zielPunkt, 1 - Math.pow(0.02, dt));
    const cam = new THREE.Vector3(W.ziel.x + Math.sin(W.azimut) * Math.cos(W.hoehe) * dist, W.ziel.y + Math.sin(W.hoehe) * dist, W.ziel.z + Math.cos(W.azimut) * Math.cos(W.hoehe) * dist);

  absatz('1. Prüfen Sie Ihre Hausaufgaben im echten NachfolgeCheck – mit 8 Dimensionen, Ergebnisbericht und Tagebuch.', 10);
  platz(6); doc.setTextColor(...rgb('#1E88C7')); doc.setFontSize(10); doc.textWithLink('www.nachfolgetalk.de/mein-nachfolgecheck', R + 4, y, { url:'https://www.nachfolgetalk.de/mein-nachfolgecheck' }); y += 8;
  absatz('2. Besprechen Sie Ihre Reise und Ihre Startfrage – kostenfrei und unverbindlich:', 10);
  S.mentoren.forEach(id => { platz(6); const m = MT[id]; doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(...rgb('#1E88C7'));
    doc.textWithLink(pdfText('Termin mit ' + m.name + ': ' + m.kontakt.replace('https://', '')), R + 4, y, { url:m.kontakt }); y += 6; });
  y += 4;
  absatz('Hinweis: Die Nachfolge-Reise ist ein Lern- und Reflexionsspiel. Sie ersetzt keine Rechts-, Steuer- oder Finanzberatung.', 8, GRAU);
  return doc.output('blob');
}

async function pdfLaden(i, btn){
  const t = S.teams[i], status = document.getElementById('pdfstatus' + i);
  const alt = btn.textContent; btn.disabled = true; btn.textContent = 'PDF wird erstellt …'; if(status) status.textContent = '';
  try{
    const blob = await berichtPdf(t);
    const name = ('Reisebericht ' + t.name).replace(/[\\/:*?"<>|]+/g, '').trim() + '.pdf';
    const dl = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null;
    if(dl){
      try{ await dl.save({ filename:name, data:blob }); if(status) status.textContent = 'Gespeichert.'; }
      catch(e){ if(status) status.textContent = e && e.code === 'declined' ? 'Download abgebrochen.' : 'Der Download ist in dieser Ansicht nicht möglich.'; }
    } else {
      const url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
      if(status) status.textContent = 'PDF erstellt.';
    }
  }catch(e){ if(status) status.textContent = 'Das PDF konnte nicht erstellt werden: ' + ((e && e.message) || e); }
  btn.disabled = false; btn.textContent = alt;
}

/* ---------- Anbindung an nachfolgetalk.de (Wix) ---------- */
const WIX = { eingebettet: window.parent !== window, mitglied: null };
function wixSenden(m){ if(WIX.eingebettet){ try{ window.parent.postMessage(Object.assign({ quelle:'reise' }, m), '*'); }catch(e){} } }
function wixUebernehmen(){
  const d = WIX.mitglied;
  if(!d || !S || S.phase !== 'setup' || S.setup.wixUebernommen) return;
  const t = S.setup.teams[0];
  if(!t.name && (d.vorname || d.nachname)) t.name = [d.vorname, d.nachname].filter(Boolean).join(' ');
  if(Array.isArray(d.werte)){ d.werte.forEach((w, j) => { if(typeof w === 'number') t.werte[j] = Math.max(1, Math.min(5, w)); }); }
  S.setup.wixUebernommen = true;
  S.setup.checkInfo = Array.isArray(d.werte) ? { datum: d.datum, offen: d.werte.filter(w => w === null).length, laufend: d.status === 'laufend' } : null;
  sichern(); render();
}
window.addEventListener('message', e => {
  const m = e.data || {};
  if(e.source !== window.parent || m.quelle !== 'reise-wix') return;
  if(m.typ === 'mitglied'){ WIX.mitglied = m.daten || null; wixUebernehmen(); }
});
function checkHinweisHtml(){
  const c = S.setup.checkInfo; if(!c) return '';
  const datum = c.datum ? new Date(c.datum).toLocaleDateString('de-DE') : '';
  return `<div class="startfrage" style="margin:10px 0 4px"><small>Aus Ihrem NachfolgeCheck</small>Ihre Werte${datum ? ' vom ' + esc(datum) : ''} sind übernommen${c.laufend ? ' (Check noch nicht abgeschlossen)' : ''}${c.offen ? ' – ' + c.offen + ' Dimension' + (c.offen > 1 ? 'en sind' : ' ist') + ' noch offen und steh' + (c.offen > 1 ? 'en' : 't') + ' auf 3' : ''}. Sie können sie hier anpassen.</div>`;
}
function wixAbschlussMelden(){
  if(!WIX.eingebettet || !S || S.phase !== 'ende' || S.gemeldet) return;
  const t = S.teams[0];
  S.gemeldet = true; sichern();
  wixSenden({ typ:'abgeschlossen', daten:{ qualitaet:index(t), punkte:t.punkte, maxPunkte:t.maxPunkte, monate:monat(t), notfall:!!t.notfall,
    dauer:dauerCfg().name, weg:t.weg || '', fertig:!!t.fertig,
    hausaufgaben:t.werte.map((v,i)=>({v,i})).sort((a,b)=>a.v-b.v).slice(0,3).map(h => DIM[h.i].name) } });
}
function render(){
  if(S.phase === 'setup' && WIX.mitglied && !S.setup.wixUebernommen){ wixUebernehmen(); return; }
  const app = document.getElementById('app');
  if(S.phase === 'setup') app.innerHTML = setupAnsicht();
  else if(S.phase === 'spiel'){ app.innerHTML = spielAnsicht(); if(WELT.modus === '3d') weltEinhaengen(); }
  else { app.innerHTML = endeAnsicht(); wixAbschlussMelden(); }
}
function kopf(rechts){
  return `<header class="kopf"><h1 class="marke">Die Nachfolge-<span>Reise</span></h1><span class="unterzeile">Ein Nachfolgespiel von NachfolgeTalk</span><span class="raum"></span>${rechts||''}</header>`;
}

/* ---------- Einstieg ---------- */
function skala(ti, j, v){
  return `<div class="skala" role="group" aria-label="${esc(DIM[j].name)}">${[1,2,3,4,5].map(n => `<button type="button" class="${n===v?'an '+(n<=2?'r':n===3?'g':'gr'):''}" aria-pressed="${n===v}" onclick="S.setup.teams[${ti}].werte[${j}]=${n};sichern();render()">${n}</button>`).join('')}</div>`;
}

    <p style="margin:0 0 6px;color:var(--tinte2)">Schätzen Sie sich in den 8 Dimensionen des NachfolgeChecks ein – oder übernehmen Sie Ihre Ampel: rot = 1–2, gelb = 3, grün = 4–5.</p>
    ${DIM.map((d,j) => `<div class="bewertung"><span class="dn">${d.nr} · ${esc(d.name)}</span><span class="dq">${esc(B.hilfefragen[j])}</span>${skala(i,j,t.werte[j])}</div>`).join('')}`;

function setupAnsicht(){
  const st = S.setup;
  const weitere = st.teams.slice(1).map((t,k) => `<div class="teamblock">${teamFormular(t, k+1)}</div>`).join('');
  return kopf() + `<div class="einstieg">
    <section class="tafel">
      <h2>Ihre Reise beginnt</h2>
      <p>Ein realistisches Nachfolgespiel entlang der Heldenreise. Sie reisen über zwölf Stationen – vom Alltag, in dem alles läuft, bis zum Leben nach der Firma.</p>
      ${teamFormular(st.teams[0], 0)}
      <div class="schritt">4 · Wie lange möchten Sie reisen?</div>
      <div class="mentorwahl dauerwahl">${Object.entries(DAUER).map(([id, d]) => `<label class="${(st.dauer||'standard')===id?'an':''}"><input type="radio" name="dauer" id="d_${id}" ${(st.dauer||'standard')===id?'checked':''} onchange="S.setup.dauer='${id}';sichern();render()"><span><b>${d.name} · ${d.zeit}</b><small>${esc(d.text)} ${d.joker} Mentor-Joker.</small></span></label>`).join('')}</div>
      <div class="schritt">5 · Wer begleitet Sie?</div>
      <p style="margin:0 0 8px;color:var(--tinte2)">Wer hat Ihnen das Spiel empfohlen? Ihr Mentor stellt die entscheidenden Fragen und gibt Ihnen auf Wunsch einen Hinweis (Mentor-Joker).</p>
      <div class="mentorwahl">${Object.entries(MT).map(([id, m]) => { const an = st.mentoren.includes(id);
        return `<label class="${an?'an':''}"><input type="checkbox" id="m_${id}" ${an?'checked':''} onchange="mentorUmschalten('${id}',this.checked)">${portrait(id)}<span><b>${esc(m.name)}</b><small>${esc(m.rolle)}</small></span></label>`; }).join('')}</div>
      ${weitere}
      <div class="aktion" style="border-top:1px solid var(--linie);padding-top:14px;margin-top:16px">
        <button class="knopf leise" onclick="teamDazu()" ${st.teams.length>=6?'disabled':''}>Weiteres Team hinzufügen</button>
        <span class="raum" style="flex:1"></span>
        <button class="knopf" onclick="starten()">Reise beginnen</button>
      </div>
    </section>
    <aside class="panel">
      <section class="tafel">
        <h2>Ihre Begleiter</h2>
        <p>Vier Menschen aus unseren Nachfolgegeschichten reisen immer mit. Sie kommentieren, was passiert, und Sie können jeden von ihnen an jeder Station um Rat fragen. Nicht jeder Rat ist gut – genau wie im echten Leben.</p>
        <div class="runde-begleiter" style="margin-top:12px">${AVIDS.map(id => `<div class="bgl">${portrait(id)}<div><b>${esc(AV[id].name)} · ${esc(AV[id].art)}</b><span>${esc(AV[id].rolle)} (aus „${esc(AV[id].buch)}“)</span></div></div>`).join('')}</div>
      </section>
      <section class="tafel regeln">
        <h2>So wird gespielt</h2>
        <ol>
          <li>An jeder Station ziehen Sie eine <b>Prüfungskarte</b> und wählen eine von drei Antworten. Jede Antwort ist 0 bis 3 Punkte wert.</li>
          <li>Die <b>stärkste Antwort</b> gelingt immer. Eine <b>solide</b> gelingt, wenn Sie in der betroffenen Dimension vorbereitet sind (ab Wert 3). Wer <b>ausweicht</b>, verliert Zeit.</li>
          <li>Die Karten richten sich nach Ihrer Einschätzung: Ihre roten Dimensionen kommen häufiger dran.</li>
          <li><b>Zeit</b>: Jede Etappe dauert so lange wie in der Praxis, von einem Monat bis zu einem Jahr. Die stärkste Antwort spart Zeit, Ausweichen kostet zusätzlich. Wer länger als 60 Monate braucht, landet in der Notfall-Nachfolge.</li>

function mentorUmschalten(id, an){ const m = S.setup.mentoren.filter(x => x !== id); if(an) m.push(id); if(!m.length) m.push(id === 'wolfgang' ? 'roland' : 'wolfgang'); S.setup.mentoren = m; sichern(); render(); }
function teamDazu(){ S.setup.teams.push(neuesTeam(S.setup.teams.length)); sichern(); render(); setTimeout(() => { const el = document.getElementById('tn' + (S.setup.teams.length-1)); if(el) el.focus(); }, 0); }

/* ---------- Spiel ---------- */
function chipsHtml(eff){
  return `<div class="chips">${eff.filter(e => e.v || e.roh).map(e => {
    const v = e.v, kl = e.zeit ? (v > 0 ? 'minus' : 'plus') : v > 0 ? 'plus' : v < 0 ? 'minus' : '';
    const txt = v === 0 && e.roh ? (e.roh>0 ? 'schon 5' : 'schon 1') : (v>0?'+':'−') + Math.abs(v) + (e.einheit||'');
    return `<span class="chip ${kl}">${esc(e.k)} ${txt}</span>`; }).join('')}</div>`;
}
function bewertungHtml(t, k, o){
  const b = S.zug.bewertung || {p:o.p}, beste = k.optionen[k.beste], bb = String.fromCharCode(65 + k.beste);
  const sterne = [1,2,3].map(n => `<span style="color:${n<=b.p?'#C98A00':'#C9D3E3'};font-size:22px">★</span>`).join('');
  let warum = '';
  if(b.p === 3) warum = 'Die stärkste Antwort auf diese Situation.';
  else if(b.p === 0) warum = 'Ausweichen kostet Zeit und Vertrauen.';
  else if(b.joker) warum = 'Eine solide Antwort – mit Ihrem Mentor an der Seite trägt sie.';
  else if(S.zug.ergebnis && S.zug.ergebnis.ok) warum = `Eine solide Antwort. Ihre Vorbereitung in „${DIM[o.dim-1].name}“ (Wert ${b.wert}) trägt sie.`;
  else warum = `Eine solide Antwort – aber Ihre Vorbereitung in „${DIM[o.dim-1].name}“ (Wert ${b.wert}) reicht dafür noch nicht.`;
  return `<div style="display:flex;align-items:center;gap:10px;margin-top:6px">${sterne}<span class="rechnung"><b>${b.p} von 3 Punkten</b></span></div>
    <p class="rechnung" style="margin:4px 0 0">${esc(warum)}${b.p < 3 ? ` Die stärkste Antwort wäre <b>${bb}</b> gewesen: ${esc(beste.t)}.` : ''}</p>`;
}

        <p class="lage">${esc(e.x)}</p>${chipsHtml(e.effekte)}
        ${e.weiter ? `<p class="rechnung" style="margin:8px 0 0">Station geschafft. Diese Etappe hat ${e.dauer} ${e.dauer===1?'Monat':'Monate'} gedauert${e.gespart?' – einen Monat schneller dank Ihrer starken Antworten':''}. Ihre Nachfolge läuft jetzt seit ${monat(t)} Monaten.</p>` : (!e.bleibt && !e.zurueck ? `<p class="rechnung" style="margin:8px 0 0">Karte ${e.hier} von ${e.n} an dieser Station geschafft. Weiter geht es in Ihrer nächsten Runde.</p>` : '')}
        ${buchHtml(buchHinweise(k.id, k.station, t.weg))}
        ${e.zurueck ? `<p class="mentor" style="color:#C4442E"><b style="color:#C4442E">Rückschlag:</b> Wer an einer Schwelle ausweicht, fällt zurück. Sie stehen wieder an Station ${t.pos} · ${esc(ST[t.pos].held)}${e.n > 1 ? ' und brauchen eine bestandene Karte, um wieder aufzuschließen' : ''}.</p>` : ''}
        ${e.bleibt ? `<p class="mentor"><b>Schwelle:</b> Sie bleiben an Station ${t.pos} und versuchen es in der nächsten Runde erneut.</p>` : ''}
        ${e.reaktion ? blase(e.reaktion.id, e.reaktion.text) : ''}
        <div class="mentor"><b>Frage des Mentors:</b> ${esc(k.mentor)}</div></div>
        <div class="aktion"><button class="knopf" onclick="weiter()">Weiter</button></div>`;
      break; }
    case 'blitz':
      h += `<div class="ziel">Station ${t.pos} · <b>${esc(ST[t.pos].held)}</b></div><p>An dieser Station wartet ein Ereignis. Das Leben fragt nicht, ob es passt.</p><div class="aktion"><button class="knopf" onclick="ereignisZiehen()">Ereigniskarte ziehen</button></div>`;
      break;
    case 'ereignis': case 'ereignisErgebnis': {
      const z = S.zug.ereignis, e = D.ereignisse[z.i], ek = ereignisKarte();
      h += `<div class="pkarte ereignis auf"><div class="etikett">Ereignis an Station ${t.pos}</div><h3>${esc(e.titel)}</h3><p class="lage">${esc(e.text)}</p>
        ${e.dim ? `<div class="rechnung">Betrifft ${esc(DIM[e.dim-1].name)}: ab Wert ${e.min} abgefedert (Ihr Wert ${z.wertVor})</div><p class="lage" style="margin-top:8px"><b>${z.abgewehrt?'Abgefedert.':'Voll getroffen.'}</b> ${esc(z.x)}</p>` : ''}
        ${chipsHtml(z.effekte)}`;
      if(S.schritt === 'ereignis'){
        h += `<p class="lage" style="margin-top:12px"><b>Wie reagieren Sie?</b></p>
          ${e.optionen.map((o,j) => `<button class="option" onclick="ereignisAntwort(${j})"><span class="t">${String.fromCharCode(65+j)} · ${esc(o.t)}</span><span class="probe">Betrifft: <b>${esc(DIM[o.dim-1].name)}</b></span></button>`).join('')}
          <div class="mentor"><b>Frage des Mentors:</b> ${esc(e.mentor)}</div>
          <div class="fragen"><span class="lbl">Begleiter fragen</span>${AVIDS.map(id => `<button class="fragbtn" onclick="fragen('${id}')" ${S.zug.gefragt.includes(id)?'disabled':''}>${portrait(id,true)} ${esc(AV[id].name)}</button>`).join('')}</div>
          ${S.zug.gefragt.map(id => blase(id, avatarTipp(id, t, ek))).join('')}</div>`;
      } else {
        const a = z.antwort, o = e.optionen[a.j], beste = e.optionen[e.beste];
        const sterne = [1,2,3].map(n => `<span style="color:${n<=o.p?'#F5AD00':'#4A6396'};font-size:22px">★</span>`).join('');
        h += `<p class="lage" style="margin-top:12px"><b>Ihre Reaktion:</b> ${String.fromCharCode(65+a.j)} · ${esc(o.t)}</p>
          <div style="display:flex;align-items:center;gap:10px">${sterne}<span class="rechnung"><b>${o.p} von 3 Punkten</b></span></div>
          ${o.p < 3 ? `<p class="rechnung" style="margin:4px 0 0">Die stärkste Reaktion wäre <b>${String.fromCharCode(65+e.beste)}</b> gewesen: ${esc(beste.t)}.</p>` : ''}
          <p class="lage" style="margin-top:8px">${esc(o.x)}</p>${chipsHtml(a.effekte)}
          ${blase(a.reaktion.id, a.reaktion.text)}
          ${buchHtml(buchHinweise(null, null, null, e.titel))}
          <div class="mentor"><b>Frage des Mentors:</b> ${esc(e.mentor)}</div></div>
          <div class="aktion"><button class="knopf" onclick="weiter()">Weiter</button></div>`;
      }
      break; }
    case 'zeitaus':
      h += `<div class="pkarte ereignis"><div class="etikett">Achtung</div><h3>${esc(D.zeitAus.titel)}</h3><p class="lage">${esc(D.zeitAus.text)}</p>${chipsHtml([{k:'Kraft',v:D.zeitAus.f.e}])}</div><div class="aktion"><button class="knopf" onclick="if(!pruefeZustand())naechstesTeam()">Weiter</button></div>`;
      break;
    case 'erschoepft':
      h += `<div class="pkarte ereignis"><div class="etikett">Achtung</div><h3>${esc(D.erschoepft.titel)}</h3><p class="lage">${esc(D.erschoepft.text)}</p><p class="rechnung">Nach der Pause geht es mit ${D.erschoepft.neu} Kraft weiter.</p></div><div class="aktion"><button class="knopf" onclick="naechstesTeam()">Weiter</button></div>`;
      break;
    case 'pause':
      h += `<p>Sie setzen diese Runde aus und sammeln Kraft.</p>${blase(S.mentoren[0], 'Was gibt Ihnen wieder Kraft – und wer kann Sie gerade entlasten?', true)}<div class="aktion"><button class="knopf" onclick="pauseVorbei()">Weiter</button></div>`;
      break;
    case 'elixier': {
      const m = S.mentoren[0];
      h += `<div class="pkarte auf"><div class="etikett">Station 12 · Rückkehr mit dem Elixier</div><h3>Angekommen!</h3><p class="lage">Sie haben die Reise geschafft${t.notfall?' – wenn auch als Notfall-Nachfolge':''}. Zeit für Ihre Startfrage:</p>
        <div class="startfrage"><small>Ihre Frage an die Reise</small>${esc(t.frage)}</div>
        ${blase(m, 'Was antworten Sie heute auf Ihre Frage? Und was würden Sie einem Unternehmer sagen, der gerade an Station 2 steht?', true)}
        <label class="rechnung" for="antwort" style="display:block;margin-top:10px">Ihre Antwort heute</label>
        <textarea id="antwort" class="frage" style="background:#fff;color:var(--karteText)" oninput="team().antwort=this.value;sichern()">${esc(t.antwort)}</textarea>${buchHtml(buchHinweise(null, 12))}</div>
        <div class="aktion"><button class="knopf" onclick="naechstesTeam()">${S.teams.every(x=>x.fertig)?'Zur Auswertung':'Weiter'}</button></div>`;
      break; }
  }
  return h;
}
function teamListe(){
  return `<div class="teams"><div class="legende">${DIM.map(d=>`<span title="${esc(d.name)}">${d.nr}</span>`).join('')}</div>${S.teams.map((t,i) => `
    <div class="teamkarte ${i===S.aktiv?'dran':''}"><span class="punkt" style="background:${t.farbe}"></span>
      <span class="tname">${esc(t.name)}${t.fertig?' ✓':''}${t.notfall?' · Notfall':''}</span>
      <span class="tinfo">Stn. ${t.pos} · ${t.punkte}/${t.maxPunkte} Pkt. · Monat ${monat(t)} · Kraft ${t.kraft} · Joker ${t.joker}</span>
      <div class="balken">${t.werte.map((v,j)=>{ const f = v<=2?'#EE6A52':v===3?'#F5AD00':'#43C384'; return `<div title="${esc(DIM[j].name)}: ${v}"><i style="height:${v*20}%;background:${f}"></i><span>${v}</span></div>`; }).join('')}</div>
    </div>`).join('')}</div>`;
}
function begleiterLeiste(){
  return `<div class="teams" style="padding:12px 14px"><div class="ziel" style="margin-bottom:8px">Mit auf der Reise</div><div style="display:flex;flex-wrap:wrap;gap:10px">
    ${S.mentoren.map(id => `<span class="bgl">${portrait(id,true)}<span><b style="color:var(--tinte)">${esc(MT[id].kurz)}</b>Mentor</span></span>`).join('')}
    ${AVIDS.map(id => `<span class="bgl">${portrait(id,true)}<span><b style="color:var(--tinte)">${esc(AV[id].name)}</b>${esc(AV[id].art)}</span></span>`).join('')}</div></div>`;
}
function spielAnsicht(){
  const t = team();
  return kopf(`<button class="knopf leise klein" onclick="beendenFragen()">Spiel beenden</button>`) + `<div class="spiel">
    <div>${karteHtml()}
      ${t.gestartet ? `<div class="startfrage" style="margin-top:14px"><small>Frage an die Reise · ${esc(t.name)}</small>${esc(t.frage)}</div>` : ''}</div>
    <div class="panel"><section class="zug" aria-live="polite">${zugAnsicht()}</section>${teamListe()}${begleiterLeiste()}
      <div class="fuss" id="beenden"></div></div></div>`;
}
function beendenFragen(){
  document.getElementById('beenden').innerHTML = `<span class="hinweis" style="align-self:center">Spiel jetzt auswerten?</span><button class="knopf klein" onclick="S.phase='ende';sichern();render()">Ja, auswerten</button><button class="knopf leise klein" onclick="this.parentNode.innerHTML=''">Weiterspielen</button>`;
}

/* ---------- Auswertung ---------- */
function berichtText(t){
  const schwach = t.werte.map((v,i)=>({v,i})).sort((a,b)=>a.v-b.v).slice(0,3);
  return `Reisebericht ${t.name}${t.firma?' ('+t.firma+')':''}\n\nMeine Frage an die Reise: ${t.frage}\nMeine Antwort heute: ${t.antwort || '(noch offen)'}\n\nEntscheidungsqualität: ${index(t)} % (${t.punkte} von ${t.maxPunkte} Punkten)\nDauer der Nachfolge: ${monat(t)} Monate · Kraft: ${t.kraft}${t.notfall?' · Notfall-Nachfolge':''}\n\nDimensionen (Start → Ende):\n` +
    DIM.map((d,i)=>`${d.nr}. ${d.name}: ${t.start[i]} → ${t.werte[i]}`).join('\n') +
    `\n\nMeine drei Hausaufgaben:\n` + schwach.map(s=>`- ${DIM[s.i].name} (Wert ${s.v})`).join('\n') +
    `\n\nReiseverlauf:\n` + t.log.map(l=>`Station ${l.st}: ${l.txt}`).join('\n') +
    `\n\nBegleitet von: ${S.mentoren.map(id => MT[id].name).join(' und ')}\nNächster Schritt: NachfolgeCheck unter https://www.nachfolgetalk.de/mein-nachfolgecheck`;
}
function kopieren(i, btn){
  const txt = berichtText(S.teams[i]);
  const fertig = () => { btn.textContent = 'Kopiert'; setTimeout(()=>btn.textContent='Bericht kopieren', 1800); };
  try{ navigator.clipboard.writeText(txt).then(fertig, () => zeigeText(i)); }catch(e){ zeigeText(i); }
}
function zeigeText(i){ const el = document.getElementById('txt'+i); el.value = berichtText(S.teams[i]); el.hidden = false; el.focus(); el.select(); }
function endeAnsicht(){
  const sortiert = [...S.teams].sort((a,b)=>index(b)-index(a));
  return kopf(`<button class="knopf leise klein" onclick="S=neuesSetup();sichern();render()">Neue Reise</button>`) + `<section class="ende">
    <h2>${S.teams.length > 1 ? 'Die Reiseberichte' : 'Ihr Reisebericht'}</h2><p class="hinweis" style="font-size:15px">Die Entscheidungsqualität zeigt, wie nah Ihre Antworten an der stärksten Antwort lagen: 100 % heißt, Sie haben an jeder Station die beste Antwort gewählt, 0 %, Sie sind jedes Mal ausgewichen. Gewonnen hat, wer etwas mitnimmt.</p>
    <div class="berichte">${sortiert.map(t => { const i = S.teams.indexOf(t);
      const schwach = t.werte.map((v,j)=>({v,j})).sort((a,b)=>a.v-b.v).slice(0,3);
      return `<article class="bericht">
      <div style="display:flex;align-items:flex-start;gap:12px"><div style="flex:1;min-width:0"><h3><span class="punkt" style="background:${t.farbe}"></span>${esc(t.name)}</h3>
        <div class="hinweis">${esc(t.firma||'')}${t.firma?' · ':''}${t.weg==='familie'?'Familie / intern':t.weg==='extern'?'Verkauf / extern':'Weg offen'} · ${t.fertig?'angekommen':'unterwegs an Station '+t.pos}</div>
        <div class="hinweis">Dauer ${monat(t)} Monate · Kraft ${t.kraft}${t.notfall?' · Notfall-Nachfolge':''}</div></div>
        <div style="text-align:right"><div class="index">${index(t)} %</div><div class="hinweis">Entscheidungsqualität<br>${t.punkte} von ${t.maxPunkte} Punkten</div></div></div>
      <div class="startfrage" style="margin-top:12px"><small>Frage an die Reise</small>${esc(t.frage)}</div>
      <label class="hinweis" for="ant${i}">Antwort heute</label>
      <textarea id="ant${i}" class="frage" style="min-height:60px;font-size:15px" oninput="S.teams[${i}].antwort=this.value;sichern()">${esc(t.antwort)}</textarea>
      <div style="margin-top:10px">${DIM.map((d,j)=>{ const dl = t.werte[j]-t.start[j]; return `<div class="dimzeile"><span>${d.nr} · ${esc(d.kurz)}</span><div class="dimbar"><i style="width:${t.werte[j]*20}%"></i><em style="left:calc(${t.start[j]*20}% - 1.5px)" title="Start ${t.start[j]}"></em></div><span class="delta" style="color:${dl>0?'var(--ok)':dl<0?'var(--no)':'var(--tinte2)'}">${dl>0?'+':dl<0?'−':'±'}${Math.abs(dl)}</span></div>`; }).join('')}
        <div class="hinweis">Balken = Endwert (1–5), Strich = Startwert</div></div>
      <div class="hausaufgaben"><h4>Die drei Hausaufgaben</h4><ul>${schwach.map(s=>`<li>${esc(DIM[s.j].name)} (Wert ${s.v})</li>`).join('')}</ul>
        <p class="hinweis" style="margin:8px 0 0">Wie sieht es in Ihrem echten Unternehmen aus? <a href="https://www.nachfolgetalk.de/mein-nachfolgecheck" target="_blank" rel="noopener">Zum NachfolgeCheck</a></p></div>
      <div class="logbuch"><h4>Reiseverlauf</h4>${t.log.map(l=>`<div><b>Station ${l.st}</b> · ${esc(l.txt)}</div>`).join('') || '<div>Noch keine Einträge.</div>'}</div>
      <div class="kopierzeile"><button class="knopf klein" onclick="pdfLaden(${i},this)">Reisebericht als PDF</button><button class="knopf klein leise" onclick="kopieren(${i},this)">Bericht kopieren</button><span class="hinweis" id="pdfstatus${i}" style="align-self:center" aria-live="polite"></span></div>
      <textarea id="txt${i}" class="feld" rows="8" hidden readonly style="margin-top:8px"></textarea>
    </article>`; }).join('')}</div>
    <div class="tafel" style="margin-top:18px"><h2>Ihre Reise besprechen</h2><p>Ihre Startfrage und Ihre Hausaufgaben sind ein guter Anfang für ein Gespräch. Kostenfrei und unverbindlich.</p>
      <div class="cta">${S.mentoren.map(id => `<a class="knopf" href="${MT[id].kontakt}" target="_blank" rel="noopener">Mit ${esc(MT[id].kurz)} sprechen</a>`).join('')}</div></div>
    ${S.teams.some(t=>!t.fertig) ? `<div class="aktion"><button class="knopf leise" onclick="S.phase='spiel';sichern();render()">Zurück zum Spiel</button></div>` : ''}
  </section>`;
}

/* ---------- Start ---------- */
function boot(data){
  S = (data && data.phase) ? data : (laden() || neuesSetup());
  render();
  wixSenden({ typ:'bereit' });
}
window.claude?.hot?.snapshot?.(() => S);
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
</body></html>
